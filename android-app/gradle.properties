org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Egress proxy for Gradle's HTTP client (applied as JVM system properties at
# daemon startup). No credentials: this proxy accepts unauthenticated requests.
# Google Maven goes direct (Java trusts its real cert; the proxy MITMs it).
# Maven Central goes via the proxy (direct Java fetches hang).
systemProp.http.proxyHost=hatch-egress-proxy
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=hatch-egress-proxy
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1|dl.google.com|*.google.com|maven.google.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|dl.google.com|*.google.com|maven.google.com
