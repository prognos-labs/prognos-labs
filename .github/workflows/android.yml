name: Android debug build

on:
  push:
    branches: [v1.1.17]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json

      - name: Remove box proxy settings
        run: sed -i '/proxyHost\|proxyPort\|nonProxyHosts/d' android-app/gradle.properties

      - name: Build and test
        working-directory: android-app
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prognos-1.1.17-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
