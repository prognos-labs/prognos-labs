name: Android debug build

on:
  push:
    branches: [v1.1.20]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android@v3 is broken: it always tries to install the old
      # "tools" package, which no longer exists in the SDK repository.
      # The runner already has cmdline-tools, so install the pieces
      # directly with sdkmanager instead.
      - name: Install Android SDK 34
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json

      # One stable signing key for every build, restored from repo
      # secrets. Without this, each runner generates its own debug
      # key, and the new APK cannot install over the old one.
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "SIGNING_KEYSTORE_B64 secret is missing"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > android-app/app/signing.keystore
          cat > android-app/signing.properties <<EOF
          storeFile=signing.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      # The repo's gradle.properties points Gradle at hatch-egress-proxy,
      # a host that only exists on the local development machine. On this
      # runner there is no proxy, so those lines are removed for this run only.
      - name: Remove box proxy settings
        run: |
          sed -i '/^systemProp\./d' android-app/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      # Unit tests run first, including the voice-gate tests and the
      # v1.1.12 test that reads the server voice-feedback file, which
      # now lives in the repo at trading-off-build/voice-feedback.php.
      - name: Run unit tests
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Build debug APK
        working-directory: android-app
        run: |
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prognos-1.1.20-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
