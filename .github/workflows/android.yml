name: Android debug build

on:
  push:
    branches: [v1.1.17]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android@v3 is broken: it always tries to install the old
      # "tools" package, which no longer exists in the SDK repository.
      # The runner already has cmdline-tools, so install the pieces
      # directly with sdkmanager instead.
      - name: Install Android SDK 34
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json

      # The repo's gradle.properties points Gradle at hatch-egress-proxy,
      # a host that only exists on Muse's own machine. On this runner there
      # is no proxy, so those lines are removed for this run only.
      - name: Remove box proxy settings
        run: |
          sed -i '/^systemProp\./d' android-app/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      # No unit tests here: one test reads ../trading-off-build/voice-feedback.php,
      # which is not in the repo, so it cannot pass on a clean runner.
      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prognos-1.1.17-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
